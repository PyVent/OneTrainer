name: PR smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python code style
        run: python -m ruff check modules scripts tests
      - name: Check Python syntax
        run: python -m compileall -q modules scripts
      - name: Check configuration parsing
        run: python -m unittest discover -s tests -p test_config_validation.py -v
      - name: Check backup publication and selection
        run: python -m unittest discover -s tests -p test_backup_util.py -v
      - name: Check sample path progress
        run: python -m unittest discover -s tests -p test_sample_path_progress.py -v
      - name: Check learning rate schedules
        run: python -m unittest discover -s tests -p test_lr_scheduler_util.py -v
      - name: Check training timing
        run: python -m unittest discover -s tests -p test_training_timing.py -v
      - name: Check atomic configuration writes
        run: python -m unittest discover -s tests -p test_json_atomic_write.py -v
      - name: Check layer selection filters
        run: python -m unittest discover -s tests -p test_module_filter.py -v
      - name: Check model catalog
        run: python -m unittest discover -s tests -p test_model_catalog.py -v
      - name: Check Qt entrypoints
        run: python -m unittest discover -s tests -p test_qt_only_interface.py -v
      - name: Check training UI lifecycle
        run: python -m unittest discover -s tests -p test_train_ui_lifecycle.py -v
      - name: Check TensorBoard launch
        run: python -m unittest discover -s tests -p test_tensorboard_launch.py -v
